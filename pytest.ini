[pytest]
pythonpath = .
base_url = https://practicesoftwaretesting.com
addopts = -v --html=report.html --self-contained-html --screenshot=only-on-failure --tracing retain-on-failure --reruns 2 --only-rerun TimeoutError
markers =
    api: API test cases
    ui: UI test cases
    combined: The test cases are combined by api TC and ui TCs
    smoke: Important testcases